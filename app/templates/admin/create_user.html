{% extends "base.html" %}
{% block title %}Nutzer anlegen{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">&gt; NUTZER ANLEGEN</h1>
  <a href="{{ url_for('admin.index') }}" class="btn btn-sm">&lt; ZURÜCK</a>
</div>

<div class="card" style="max-width:480px">
  <form method="post" action="{{ url_for('admin.create_user') }}" autocomplete="off">

    <div class="form-group">
      <label class="form-label">BENUTZERNAME *</label>
      <input type="text" name="username" class="form-input"
             value="{{ username|default('') }}"
             pattern="[A-Za-z0-9_\-]{3,32}" maxlength="32"
             placeholder="z.B. max_mustermann" required autofocus>
      <span class="form-hint">3–32 Zeichen: Buchstaben, Ziffern, _ oder -</span>
    </div>

    <div class="form-group">
      <label class="form-label">ANZEIGENAME</label>
      <input type="text" name="display_name" class="form-input"
             value="{{ display_name|default('') }}"
             maxlength="50" placeholder="Leer = Benutzername">
    </div>

    <div class="form-group">
      <label class="form-label">PASSWORT *</label>
      <input type="password" name="password" class="form-input"
             minlength="8" placeholder="Min. 8 Zeichen" required>
    </div>

    <div class="form-group">
      <label class="form-label">PASSWORT WIEDERHOLEN *</label>
      <input type="password" name="password_confirm" class="form-input"
             minlength="8" placeholder="Passwort wiederholen" required>
    </div>

    <div class="form-group">
      <label class="form-label">ROLLE</label>
      <select name="role" class="form-input">
        <option value="user" {% if role|default('user') == 'user' %}selected{% endif %}>USER</option>
        <option value="admin" {% if role|default('') == 'admin' %}selected{% endif %}>ADMIN</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label form-check-label">
        <input type="checkbox" name="active" value="1"
               {% if active is not defined or active %}checked{% endif %}>
        AKTIV (kann sich sofort einloggen)
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">&gt; NUTZER ANLEGEN</button>
      <a href="{{ url_for('admin.index') }}" class="btn">ABBRECHEN</a>
    </div>
  </form>
</div>

<script>
document.querySelector("form").addEventListener("submit", function(e) {
  const pw = this.querySelector("[name=password]").value;
  const pw2 = this.querySelector("[name=password_confirm]").value;
  if (pw !== pw2) {
    e.preventDefault();
    alert("Passwörter stimmen nicht überein.");
  }
});
</script>
{% endblock %}
